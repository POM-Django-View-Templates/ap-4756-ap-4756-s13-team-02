<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4 sm:px-6 lg:px-8 font-sans">
    <div class="max-w-lg mx-auto">
        <div class="mb-6">
            <a href="{% url 'book:book_list' %}" class="text-indigo-600 text-sm font-medium">&larr; Back to Books</a>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Borrow a Book</h1>

            <form method="post" action="{% url 'order:create_order' %}">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="book_id" class="block text-sm font-semibold text-gray-700 mb-2">Select Book</label>
                    <select name="book_id" id="book_id" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500">
                        {% if selected_book %}
                            <option value="{{ selected_book.id }}" selected>{{ selected_book.name }} (In Stock: {{ selected_book.count }})</option>
                        {% else %}
                            <option value="" disabled selected>-- Choose a book --</option>
                            {% for book in books %}
                                <option value="{{ book.id }}">{{ book.name }} (In Stock: {{ book.count }})</option>
                            {% endfor %}
                        {% endif %}
                    </select>
                </div>

                <div class="bg-indigo-50 p-3 rounded-md mb-6 border border-indigo-100">
                    <p class="text-xs text-indigo-700">Standard loan period is <strong>14 days</strong> from today.</p>
                </div>

                <button type="submit" class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md text-sm transition">
                    Confirm Order
                </button>
            </form>
        </div>
    </div>
</body>
</html>
